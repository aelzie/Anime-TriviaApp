<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Quiz | Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game.css">
</head>
<body class="game-page">
    <header id="hud">
        <div class="hud-item hud-progress">
            <p id="progressText" class="hud-label">Question 1 of 10</p>
            <div id="progressBar"><div id="progressBarFull"></div></div>
        </div>
        <div class="hud-item hud-timer">
            <div id="timer" class="timer-circle" aria-label="Seconds left">20</div>
        </div>
        <div class="hud-item hud-stats">
            <div class="stat"><span class="hud-label">Score</span><span id="score" class="stat-value">0</span></div>
            <div class="stat"><span class="hud-label">Streak</span><span class="stat-value"><span id="streak">0</span> 🔥</span></div>
        </div>
    </header>

    <div id="timerBar"><div id="timerBarFull"></div></div>

    <main class="question-area">
        <span id="anime-tag" class="anime-tag"></span>
        <h1 id="question" class="question">Loading…</h1>
    </main>

    <section id="feedback" class="feedback" hidden aria-live="polite">
        <div>
            <p id="feedback-title" class="feedback-title"></p>
            <p id="feedback-detail" class="feedback-detail"></p>
        </div>
        <button id="next-btn" class="btn btn-light" type="button">Next question</button>
    </section>

    <section class="choices">
        <button class="choice choice-red" type="button">
            <svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 21H2z"/></svg>
            <span class="choice-text"></span>
            <span class="choice-key">1</span>
        </button>
        <button class="choice choice-blue" type="button">
            <svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12z"/></svg>
            <span class="choice-text"></span>
            <span class="choice-key">2</span>
        </button>
        <button class="choice choice-yellow" type="button">
            <svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
            <span class="choice-text"></span>
            <span class="choice-key">3</span>
        </button>
        <button class="choice choice-green" type="button">
            <svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/></svg>
            <span class="choice-text"></span>
            <span class="choice-key">4</span>
        </button>
    </section>

    <script src="questions.js"></script>
    <script src="storage.js"></script>
    <script src="game.js"></script>
</body>
</html>
